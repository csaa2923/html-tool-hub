<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HTML Tool Hub</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#f5f7fa;color:#16202a}header{background:#101c2b;color:white;padding:24px 30px}.wrap{max-width:1200px;margin:auto;padding:24px}.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}input,select,button{padding:10px 12px;border:1px solid #dfe5eb;border-radius:8px;font:inherit}input{flex:1}button{cursor:pointer}.primary{background:#0670bd;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}.card,.admin{background:white;border:1px solid #dfe5eb;border-radius:12px;padding:16px}.preview{height:140px;overflow:hidden;background:#eef2f6}.preview iframe{width:200%;height:280px;transform:scale(.5);transform-origin:0 0;border:0;pointer-events:none}.tag{display:inline-block;padding:4px 8px;border-radius:20px;background:#edf1f5;font-size:12px;margin:8px 4px 8px 0}.muted{color:#65727e;font-size:12px}.login{position:fixed;inset:0;z-index:10;background:#101c2b;display:grid;place-items:center}.login form{background:white;padding:28px;border-radius:14px;width:min(390px,90%)}.login input{width:100%;margin:5px 0 10px}.login button{width:100%}.admin{display:none;margin-bottom:18px}.admin.open{display:block}.row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #eee;padding:8px 0}dialog{border:0;border-radius:12px;width:min(520px,94%)}dialog input,dialog select{width:100%;margin:5px 0 10px}.actions{display:flex;gap:8px;margin-top:12px}</style></head><body>
<div id="gate" class="login"><form id="login"><h2>HTML Tool Hub</h2><p>Anmeldung</p><input id="user" placeholder="Benutzer" autocomplete="username" required><input id="pass" type="password" placeholder="Passwort" autocomplete="current-password" required><button class="primary">Anmelden</button><p id="err"></p></form></div>
<header><button id="logout" style="float:right">Abmelden</button><h1>HTML Tool Hub</h1><div>Zentrale Tool-Liste · persönliche Nutzungsdaten lokal</div></header>
<main class="wrap"><section id="admin" class="admin"><div class="row"><b>Adminbereich</b><button id="closeAdmin">Schließen</button></div><div id="adminList"></div></section><div class="bar"><button id="adminBtn">⚙ Adminbereich</button><input id="q" placeholder="Tools suchen …"><select id="filter"><option value="all">Alle Datenarten</option><option value="local">Daten lokal</option><option value="online">Daten online</option><option value="none">Keine persistenten Daten</option></select><button id="add" class="primary">+ Tool hinzufügen</button><button id="export">Hub sichern</button></div><section id="grid" class="grid"></section></main>
<dialog id="dlg"><h2>Tool hinzufügen</h2><input id="name" placeholder="Name"><input id="url" placeholder="https://…"><input id="cat" placeholder="Bereich"><select id="storage"><option value="local">Daten lokal</option><option value="online">Daten online</option><option value="none">Keine persistenten Daten</option></select><select id="visibility"><option value="public">Öffentlich</option><option value="private">Privat / nur Admin</option></select><input id="note" placeholder="Hinweis"><div class="actions"><button id="cancel">Abbrechen</button><button id="save" class="primary">Speichern</button></div></dialog>
<script>
const $=s=>document.querySelector(s),LAST='hub-last-opened';let tools=[],token=sessionStorage.getItem('hub-token')||'',role=sessionStorage.getItem('hub-role')||'',adminOpen=false,last=JSON.parse(localStorage.getItem(LAST)||'{}');
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function authHeaders(){return token?{Authorization:'Bearer '+token}:{}}
function ui(){let ok=!!token,isAdmin=role==='admin';$('#gate').style.display=ok?'none':'grid';$('#adminBtn').style.display=isAdmin?'':'none';$('#add').style.display=isAdmin?'':'none';if(!isAdmin)adminOpen=false}
async function load(){let r=await fetch('/api/tools',{headers:authHeaders(),cache:'no-store'});if(r.status===401){logout();return}tools=await r.json();render()}
async function act(body){let r=await fetch('/api/tools',{method:'POST',headers:{'Content-Type':'application/json',...authHeaders()},body:JSON.stringify(body)});let d=await r.json();if(!r.ok){alert(d.error||'Aktion nicht erlaubt');return false}tools=d;render();return true}
function render(){let q=$('#q').value.toLowerCase(),f=$('#filter').value,a=tools.filter(t=>(f==='all'||t.storage===f)&&[t.name,t.cat,t.note].join(' ').toLowerCase().includes(q));$('#grid').innerHTML=a.length?a.map(t=>`<article class="card"><div class="preview"><iframe src="${esc(t.url)}"></iframe></div><h3>${esc(t.name)}</h3><div class="muted">${esc(t.cat)}</div><span class="tag">Tool online</span><span class="tag">Daten ${esc(t.storage)}</span><span class="tag">${t.visibility==='private'?'Privat':'Öffentlich'}</span><div>${esc(t.note)}</div><div class="muted">${last[t.id]?'Zuletzt geöffnet: '+new Date(last[t.id]).toLocaleString('de-AT'):'Noch nie geöffnet'}</div><div class="actions"><button class="primary" onclick="openTool('${t.id}')">Öffnen</button>${role==='admin'?'<button onclick="delTool(\''+t.id+'\')">Entfernen</button>':''}</div></article>`).join(''):'<p>Keine Tools vorhanden.</p>';$('#admin').classList.toggle('open',adminOpen);$('#adminList').innerHTML=tools.map(t=>`<div class="row"><span>${esc(t.name)}</span><select onchange="setVis('${t.id}',this.value)"><option value="public" ${t.visibility==='public'?'selected':''}>Öffentlich</option><option value="private" ${t.visibility==='private'?'selected':''}>Privat</option></select></div>`).join('')}
window.openTool=id=>{let t=tools.find(x=>x.id===id);if(!t)return;last[id]=new Date().toISOString();localStorage.setItem(LAST,JSON.stringify(last));render();window.open(t.url,'_blank','noopener')};window.delTool=id=>role==='admin'&&confirm('Tool zentral löschen?')&&act({action:'delete',id});window.setVis=(id,visibility)=>role==='admin'&&act({action:'visibility',id,visibility});
function logout(){token='';role='';sessionStorage.clear();ui()}
$('#login').onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#user').value,password:$('#pass').value})});let d=await r.json();if(!r.ok){$('#err').textContent='Benutzer oder Passwort falsch.';return}token=d.token;role=d.role;sessionStorage.setItem('hub-token',token);sessionStorage.setItem('hub-role',role);$('#pass').value='';ui();load()};$('#logout').onclick=logout;$('#q').oninput=render;$('#filter').onchange=render;$('#adminBtn').onclick=()=>{adminOpen=!adminOpen;render()};$('#closeAdmin').onclick=()=>{adminOpen=false;render()};$('#add').onclick=()=>$('#dlg').showModal();$('#cancel').onclick=()=>$('#dlg').close();$('#save').onclick=async()=>{let tool={name:$('#name').value.trim(),url:$('#url').value.trim(),cat:$('#cat').value.trim(),storage:$('#storage').value,visibility:$('#visibility').value,note:$('#note').value.trim()};if(!tool.name||!tool.url)return alert('Name und URL erforderlich');if(await act({action:'add',tool}))$('#dlg').close()};$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(tools,null,2)],{type:'application/json'}));a.download='html-tool-hub-backup.json';a.click()};ui();if(token)load();
</script></body></html>
